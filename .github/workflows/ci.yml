name: CI Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Checks (Svelte UI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Svelte linting and formatting
        run: |
          npm run check
          if npm run | grep -q '^[[:space:]]*lint[[:space:]]*$'; then
            npm run lint
          fi

      - name: Run frontend unit tests
        run: npm run test

      - name: Dry build frontend
        run: npm run build

  backend:
    name: Backend Checks (Rust & eBPF Daemon)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system and Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install eBPF dependencies
        run: |
          sudo apt-get install -y clang llvm libelf-dev protobuf-compiler

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install bpf-linker
        run: cargo install bpf-linker

      - name: Check code formatting
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo fmt --all -- --check
          else
            echo "No root Cargo.toml found. Skipping formatting check until backend crate is created."
          fi

      - name: Run Clippy
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo clippy --workspace --all-targets -- -D warnings
          else
            echo "No root Cargo.toml found. Skipping Clippy check until backend crate is created."
          fi

      - name: Run tests
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo test --workspace
          else
            echo "No root Cargo.toml found. Skipping cargo test until backend crate is created."
          fi
