name: CI Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Checks (Svelte UI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Svelte linting and formatting
        run: |
          npm run check
          if npm run | grep -q '^[[:space:]]*lint[[:space:]]*$'; then
            npm run lint
          fi

      - name: Run frontend unit tests
        run: npm run test

      - name: Dry build frontend
        run: npm run build

  backend:
    name: Backend Checks (Rust & eBPF Daemon)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system and Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install eBPF dependencies
        run: |
          sudo apt-get install -y clang llvm libelf-dev protobuf-compiler

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install bpf-linker and eBPF toolchain
        run: |
          if [ -f "Cargo.toml" ]; then
            # Install pre-built binary using cargo-binstall to avoid building LLVM from source
            curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
            cargo binstall --no-confirm bpf-linker
            rustup toolchain install nightly --component rust-src,clippy
          else
            echo "No root Cargo.toml found. Skipping bpf-linker installation."
          fi

      - name: Check code formatting
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo fmt --all -- --check
          elif [ -f "desktop-ui/src-tauri/Cargo.toml" ]; then
            cargo fmt --manifest-path desktop-ui/src-tauri/Cargo.toml --all -- --check
          else
            echo "No Cargo.toml found. Skipping formatting check."
          fi

      - name: Run Clippy
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo clippy --workspace --all-targets -- -D warnings
            if [ -d "core-daemon-ebpf" ]; then
              cargo +nightly clippy --manifest-path core-daemon-ebpf/Cargo.toml --target bpfel-unknown-none -Z build-std=core -- -D warnings
            fi
          elif [ -f "desktop-ui/src-tauri/Cargo.toml" ]; then
            cargo clippy --manifest-path desktop-ui/src-tauri/Cargo.toml --all-targets -- -D warnings
          else
            echo "No Cargo.toml found. Skipping Clippy check."
          fi

      - name: Run tests
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo test --workspace
          elif [ -f "desktop-ui/src-tauri/Cargo.toml" ]; then
            cargo test --manifest-path desktop-ui/src-tauri/Cargo.toml
          else
            echo "No Cargo.toml found. Skipping cargo test."
          fi
